[theme]
primaryColor = "#6366f1"
backgroundColor = "#0f172a"
secondaryBackgroundColor = "#1e293b"
textColor = "#f1f5f9"
font = "sans serif"

[client]
showErrorDetails = true

[server]
port = 8501
headless = false
enableCORS = false
enableXsrfProtection = true  # 面板嵌有模型输出，XSRF 防护保持开启（局域网/共享部署的底线防护）
maxUploadSize = 200
maxMessageSize = 200
